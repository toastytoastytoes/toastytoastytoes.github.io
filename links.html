<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Curated Links</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #0f172a;
        }
        p {
            color: #64748b;
            margin-top: 0;
            margin-bottom: 24px;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            margin-bottom: 12px;
        }
        a {
            display: block;
            padding: 16px;
            background: #f1f5f9;
            color: #2563eb;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: background 0.2s, transform 0.1s;
        }
        a:hover {
            background: #e2e8f0;
            color: #1d4ed8;
            transform: translateY(-1px);
        }
        a:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Useful Hyperlinks</h1>
        <p>A beautifully styled list of essential websites.</p>
        <ul>
            <li><a href="https://www.google.com" target="_blank">Google Search</a></li>
            <li><a href="https://www.wikipedia.org" target="_blank">Wikipedia</a></li>
            <li><a href="https://www.github.com" target="_blank">GitHub</a></li>
            <li><a href="https://news.ycombinator.com" target="_blank">Hacker News</a></li>
        </ul>
    </div>
</body>
</html>
